<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="Lupinum Tree" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Create ASCII, Unicode, Markdown, and JSON directory trees from indented text or a local folder. Free, open source, and private."
    />
    <link rel="canonical" href="https://tree.lupinum.com/" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tree.lupinum.com/" />
    <meta property="og:site_name" content="Lupinum Tree" />
    <meta property="og:title" content="ASCII Tree Generator — Lupinum Tree" />
    <meta
      property="og:description"
      content="Create clean directory trees for README files, documentation, code comments, and technical plans."
    />
    <meta property="og:image" content="https://tree.lupinum.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lupinum Tree ASCII tree generator" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ASCII Tree Generator — Lupinum Tree" />
    <meta
      name="twitter:description"
      content="Create clean directory trees for README files, documentation, code comments, and technical plans."
    />
    <meta name="twitter:image" content="https://tree.lupinum.com/og-image.png" />
    <title>ASCII Tree Generator — Lupinum Tree</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://tree.lupinum.com/#website",
            "url": "https://tree.lupinum.com/",
            "name": "Lupinum Tree"
          },
          {
            "@type": "WebApplication",
            "@id": "https://tree.lupinum.com/#app",
            "url": "https://tree.lupinum.com/",
            "name": "ASCII Tree Generator",
            "alternateName": "Lupinum Tree",
            "description": "Create ASCII, Unicode, Markdown, and JSON directory trees from indented text or a local folder.",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Any",
            "browserRequirements": "Requires a modern web browser",
            "isAccessibleForFree": true,
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "EUR"
            },
            "publisher": {
              "@type": "Organization",
              "name": "Lupinum",
              "url": "https://lupinum.com/"
            }
          }
        ]
      }
    </script>
    <script>
      ;(() => {
        let stored = null
        try {
          stored = localStorage.getItem('tree-theme')
        } catch {
          // Theme still follows the operating system when browser storage is unavailable.
        }
        const dark =
          stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="app"><!--ssr-outlet--></div>
    <script type="module" src="/src/entry-client.ts"></script>
  </body>
</html>
