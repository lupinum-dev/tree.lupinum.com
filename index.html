    <title>ASCII Tree Generator — folder trees for README files and docs</title>
    <script>
      ;(() => {
        let stored = null
        try {
          stored = localStorage.getItem('tree-theme')
        } catch {
          // Theme still follows the operating system when browser storage is unavailable.
        }
        const dark =
          stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <!--
      THESIS: A directory workbench where saved trees, source, and result stay visible; it refuses the old stack of tabs, cards, and repeated controls.
      OWN-WORLD: Neutral Geist surfaces, one quiet emerald signal, continuous work planes, compact shadcn controls, and mono only for tree data.
      STORY: Choose or create a tree, edit its source, tune the format, and copy a correct result without leaving the workspace.
      FIRST VIEWPORT: A 272px tree-and-settings rail beside a flexible two-pane editor; Copy output stays in the result header.
      FORM: Desktop editing instrument with an off-canvas mobile rail; pinned Lupinum workbench direction.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="app"><!--ssr-outlet--></div>
    <script type="module" src="/src/entry-client.ts"></script>
  </body>
